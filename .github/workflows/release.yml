name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already committed to main, without a v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: vibe-check-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://vibecheck.wcgw.fun
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from main; received $GITHUB_REF" >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Fails in seconds, before anything is built or published, when the site
      # deploy could not finish. npm versions cannot be replaced afterwards.
      - name: Preflight deploy credentials
        run: node scripts/release-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SCAN_API: ${{ vars.NEXT_PUBLIC_SCAN_API }}

      - name: Use an npm CLI with trusted publishing support
        run: npm install --global "npm@11.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate versions, doc pins, and CHANGELOG
        run: pnpm release:validate -- "$VERSION"

      - name: Reject a tag that points elsewhere
        shell: bash
        run: |
          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            target=$(git rev-list -n 1 "$tag")
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "$tag points to $target, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: Build workspace libraries for app type-checks
        run: pnpm --filter @wcgw/vibe-check-protocol --filter @wcgw/vibe-check-core --filter @wcgw/vibe-check build

      - name: Type-check packages and apps
        run: |
          pnpm lint
          pnpm --filter web lint
          pnpm --filter @wcgw/vibe-check-scan-worker lint

      - name: Unit tests and builds
        run: |
          pnpm test
          pnpm build
          pnpm --filter @wcgw/vibe-check size

      - name: Install Chromium
        run: pnpm --filter @wcgw/vibe-check-mcp-roundtrip exec playwright install --with-deps chromium

      - name: Packaged MCP round-trip
        run: pnpm test:e2e:mcp

      - name: Verify package contents
        run: pnpm release:check-packages -- "$VERSION"

      # Prereleases go to the `next` dist-tag. Versions already on npm are only
      # accepted when their provenance names this commit (GITHUB_SHA).
      - name: Publish missing npm packages with OIDC
        run: pnpm release:publish -- "$VERSION"

      # NEXT_PUBLIC_SCAN_API is inlined into the public /scan page at build
      # time. Leave the variable unset to ship the page without the shared
      # leaderboard; the preflight refuses a local address.
      - name: Deploy the documentation site
        run: pnpm --filter web cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SCAN_API: ${{ vars.NEXT_PUBLIC_SCAN_API }}

      - name: Verify production
        run: pnpm smoke:production

      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$GITHUB_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/release-notes.md"
            node scripts/release-notes.mjs "$VERSION" > "$notes"
            if [[ "${VERSION%%+*}" == *-* ]]; then
              release_flag=--prerelease
            else
              release_flag=--latest
            fi
            gh release create "$tag" --target "$GITHUB_SHA" --title "VibeCheck $tag" --notes-file "$notes" "$release_flag"
          fi
