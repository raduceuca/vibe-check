name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 24 is the release runtime (.nvmrc, release.yml); 22 is the oldest
        # maintained line the toolchain supports (vite 8, jsdom 27).
        node: [22, 24]
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries for app type-checks
        run: pnpm --filter @wcgw/vibe-check-protocol --filter @wcgw/vibe-check-core --filter @wcgw/vibe-check build

      - name: Type-check packages and apps
        run: |
          pnpm lint
          pnpm --filter web lint
          pnpm --filter @wcgw/vibe-check-scan-worker lint

      - name: Unit tests
        run: pnpm test

      - name: Root coverage run
        if: matrix.node == 24
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: React size budget
        run: pnpm --filter @wcgw/vibe-check size

      - name: Install Chromium
        run: pnpm --filter @wcgw/vibe-check-mcp-roundtrip exec playwright install --with-deps chromium

      - name: Packaged MCP round-trip
        run: pnpm test:e2e:mcp

      - name: Check package contents
        run: pnpm release:check-packages

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-roundtrip-diagnostics-node${{ matrix.node }}
          path: e2e/mcp-roundtrip/test-results
          if-no-files-found: ignore
