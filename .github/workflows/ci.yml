name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 24 is the release runtime (.nvmrc, release.yml); 22 is the oldest
        # maintained line the toolchain supports (vite 8, jsdom 27).
        node: [22, 24]
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.12.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries for app type-checks
        run: pnpm --filter @wcgw/vibe-check-protocol --filter @wcgw/vibe-check-core --filter @wcgw/vibe-check build

      - name: Type-check packages and apps
        run: |
          pnpm lint
          pnpm --filter web lint
          pnpm --filter @wcgw/vibe-check-scan-worker lint

      - name: Unit tests
        run: pnpm test

      - name: Root coverage run
        if: matrix.node == 24
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: React size budget
        run: pnpm --filter @wcgw/vibe-check size

      - name: Install Chromium
        run: pnpm --filter @wcgw/vibe-check-mcp-roundtrip exec playwright install --with-deps chromium

      - name: Packaged MCP round-trip
        run: pnpm test:e2e:mcp

      - name: Check package contents
        run: pnpm release:check-packages

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-roundtrip-diagnostics-node${{ matrix.node }}
          path: e2e/mcp-roundtrip/test-results
          if-no-files-found: ignore
